plugins {
    id 'multiloader-common-provider'
    id 'net.neoforged.moddev'
    id 'publish-local'
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

commonProvider {
    sources = [sourceSets.main, sourceSets.testmod]
}

neoForge {
    neoFormVersion = neo_form_version

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:$mixin_version"
    compileOnly "io.github.llamalad7:mixinextras-common:$mixinextras_version"
    annotationProcessor "io.github.llamalad7:mixinextras-common:$mixinextras_version"

    testmodImplementation(project(':common'))
}